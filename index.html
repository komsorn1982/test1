<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>แบบทดสอบวิทยาการคำนวณ ม.4</title>
<style>
:root{--p:#4f46e5;--p2:#7c3aed;--bg:#f5f7fb;--text:#1f2937;--muted:#64748b;--line:#e5e7eb;--ok:#15803d;--bad:#b91c1c}*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI","Noto Sans Thai",Tahoma,sans-serif;background:linear-gradient(135deg,#eef2ff,#f8fafc 50%,#f0fdf4);color:var(--text)}.hero{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;text-align:center;padding:42px 20px 76px}.hero h1{margin:0 0 10px;font-size:clamp(28px,4vw,46px)}.hero p{margin:0;opacity:.9}.container{width:min(980px,92%);margin:-42px auto 60px}.card{background:#fff;border-radius:20px;padding:28px;margin-bottom:22px;box-shadow:0 16px 40px rgba(15,23,42,.08)}.section-title{font-size:20px;font-weight:700;margin:0 0 18px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.field label{display:block;font-weight:600;margin-bottom:7px}.field input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;font-size:16px;outline:none}.field input:focus{border-color:var(--p);box-shadow:0 0 0 4px rgba(79,70,229,.12)}.progress-wrap{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:14px;margin-bottom:10px}.progress{height:10px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin-bottom:20px}.progress-bar{height:100%;width:0;background:linear-gradient(90deg,var(--p),var(--p2));transition:.2s}.question{border:1px solid var(--line);border-radius:16px;padding:20px;margin:18px 0}.question h3{margin:0 0 14px;font-size:18px;line-height:1.55}.option{display:flex;gap:10px;padding:12px 14px;margin:9px 0;border:1px solid #e2e8f0;border-radius:12px;cursor:pointer;background:#fafafa}.option:hover{border-color:#a5b4fc;background:#f5f3ff}.option input{margin-top:4px;accent-color:var(--p)}.actions{text-align:center;margin-top:26px}button{border:0;padding:14px 28px;border-radius:14px;font-size:17px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;box-shadow:0 10px 24px rgba(79,70,229,.22)}button:disabled{opacity:.55}.status{display:none;margin-top:16px;padding:12px 14px;border-radius:12px;font-size:14px}.status.ok{display:block;background:#dcfce7;color:#166534}.status.warn{display:block;background:#fef3c7;color:#92400e}#result{display:none;text-align:center}.score{font-size:54px;font-weight:800;color:var(--p)}.result-note{color:var(--muted)}.answer-review{text-align:left;margin-top:20px}.review-item{border-left:5px solid #cbd5e1;padding:14px 16px;margin:12px 0;background:#f8fafc;border-radius:10px}.review-item.correct{border-left-color:var(--ok)}.review-item.wrong{border-left-color:var(--bad)}.review-item small{color:var(--muted);line-height:1.6}footer{text-align:center;color:var(--muted);font-size:13px;padding:10px 0 28px}@media(max-width:700px){.grid{grid-template-columns:1fr}.card{padding:20px}}
</style>
</head>
<body>
<section class="hero"><h1>แบบทดสอบวิทยาการคำนวณ ม.4</h1><p>เรื่อง แนวคิดเชิงคำนวณ อัลกอริทึม และการแก้ปัญหา • 20 ข้อ</p></section>
<main class="container">
<section class="card"><h2 class="section-title">👤 ข้อมูลผู้เข้าสอบ</h2><div class="grid"><div class="field"><label>ชื่อ-สกุล</label><input id="fullname" placeholder="เช่น สมชาย ใจดี"></div><div class="field"><label>ชั้น</label><input id="classroom" placeholder="เช่น ม.4/1"></div><div class="field"><label>เลขที่</label><input id="number" type="number" min="1" placeholder="เช่น 12"></div><div class="field"><label>โรงเรียน (ไม่บังคับ)</label><input id="school" placeholder="ชื่อโรงเรียน"></div></div></section>
<section class="card"><div class="progress-wrap"><span>📝 เลือกคำตอบที่ถูกต้องที่สุดเพียงข้อเดียว</span><span id="answeredText">ตอบแล้ว 0/20</span></div><div class="progress"><div class="progress-bar" id="progressBar"></div></div><form id="quizForm"><div id="questions"></div><div class="actions"><button id="submitBtn" type="submit">ส่งคำตอบและตรวจคะแนน</button></div></form><div id="sendStatus" class="status"></div></section>
<section class="card" id="result"><h2>🎉 ผลการทำแบบทดสอบ</h2><div class="score" id="scoreText">0/20</div><div class="result-note" id="resultNote"></div><div class="answer-review" id="answerReview"></div></section>
<footer>แบบทดสอบวิทยาการคำนวณ ระดับชั้นมัธยมศึกษาปีที่ 4</footer>
</main>
<script>
const APPS_SCRIPT_URL="https://script.google.com/macros/s/AKfycbxCf7lnNUVyFFk7-P7UHzo_jXfpn-4M6W72ejlwwslePRnIz9Jlu8mVrGgDyaFLNPY/exec";
const quiz=[
{q:"ข้อใดอธิบายความหมายของแนวคิดเชิงคำนวณ (Computational Thinking) ได้เหมาะสมที่สุด",c:["การใช้คอมพิวเตอร์คำนวณตัวเลขให้เร็วที่สุด","กระบวนการคิดอย่างเป็นระบบเพื่อแก้ปัญหาและออกแบบวิธีแก้ปัญหา","การเขียนโปรแกรมด้วยภาษาใดภาษาหนึ่งเท่านั้น","การใช้อินเทอร์เน็ตค้นหาคำตอบ"],a:1,e:"แนวคิดเชิงคำนวณเป็นกระบวนการคิดอย่างเป็นระบบเพื่อวิเคราะห์และแก้ปัญหา"},
{q:"หากปัญหาใหญ่ถูกแบ่งออกเป็นปัญหาย่อย ๆ เพื่อให้แก้ได้ง่ายขึ้น เรียกว่าแนวคิดใด",c:["การแยกย่อยปัญหา (Decomposition)","การหารูปแบบ (Pattern Recognition)","การคิดเชิงนามธรรม (Abstraction)","การประเมินผล (Evaluation)"],a:0,e:"Decomposition คือการแบ่งปัญหาใหญ่ออกเป็นส่วนย่อยที่จัดการได้ง่ายขึ้น"},
{q:"ข้อใดเป็นตัวอย่างของการหารูปแบบ (Pattern Recognition)",c:["แบ่งงานกลุ่มออกเป็น 4 หน้าที่","สังเกตว่าปัญหาหลายข้อมีขั้นตอนการแก้คล้ายกัน","ตัดรายละเอียดที่ไม่เกี่ยวข้องออก","เขียนขั้นตอนการทำงานเป็นลำดับ"],a:1,e:"Pattern Recognition คือการมองหาความเหมือนหรือรูปแบบที่เกิดซ้ำ"},
{q:"การเลือกพิจารณาเฉพาะข้อมูลสำคัญและละรายละเอียดที่ไม่จำเป็น ตรงกับแนวคิดใด",c:["Decomposition","Pattern Recognition","Abstraction","Debugging"],a:2,e:"Abstraction คือการมุ่งเน้นสาระสำคัญและละรายละเอียดที่ไม่จำเป็น"},
{q:"อัลกอริทึม (Algorithm) หมายถึงข้อใด",c:["ชุดคำสั่งหรือขั้นตอนที่เรียงลำดับอย่างชัดเจนเพื่อแก้ปัญหา","โปรแกรมคอมพิวเตอร์ที่เขียนเสร็จแล้ว","อุปกรณ์สำหรับประมวลผลข้อมูล","ชื่อของภาษาคอมพิวเตอร์ชนิดหนึ่ง"],a:0,e:"อัลกอริทึมคือขั้นตอนการแก้ปัญหาที่มีลำดับและชัดเจน"},
{q:"สัญลักษณ์รูปสี่เหลี่ยมขนมเปียกปูนในผังงาน (Flowchart) มักใช้แทนสิ่งใด",c:["เริ่มต้น/สิ้นสุด","การรับหรือแสดงผลข้อมูล","การตัดสินใจหรือเงื่อนไข","กระบวนการประมวลผลทั่วไป"],a:2,e:"สี่เหลี่ยมขนมเปียกปูนใช้แทนการตัดสินใจหรือเงื่อนไข"},
{q:"ถ้าต้องการให้โปรแกรมแสดงข้อความซ้ำ 10 ครั้ง ควรใช้โครงสร้างใดเหมาะสมที่สุด",c:["โครงสร้างแบบลำดับ","โครงสร้างแบบเงื่อนไข","โครงสร้างแบบวนซ้ำ","โครงสร้างแบบสุ่ม"],a:2,e:"การทำคำสั่งเดิมซ้ำหลายครั้งเหมาะกับโครงสร้างแบบวนซ้ำ (Loop)"},
{q:"ตัวแปร (Variable) ในการเขียนโปรแกรมมีหน้าที่หลักอะไร",c:["เก็บค่าหรือข้อมูลที่อาจเปลี่ยนแปลงได้","เชื่อมต่ออินเทอร์เน็ต","ป้องกันไวรัส","แสดงรูปภาพเท่านั้น"],a:0,e:"ตัวแปรใช้เก็บข้อมูลสำหรับนำไปใช้งานหรือประมวลผล"},
{q:"เมื่อโปรแกรมทำงานไม่ตรงตามที่ต้องการ การค้นหาและแก้ไขข้อผิดพลาดเรียกว่าอะไร",c:["Compiling","Debugging","Uploading","Formatting"],a:1,e:"Debugging คือกระบวนการค้นหา วิเคราะห์ และแก้ไขข้อผิดพลาดของโปรแกรม"},
{q:"ข้อใดเป็นลำดับการแก้ปัญหาที่เหมาะสมที่สุด",c:["ลงมือเขียนโปรแกรม → วิเคราะห์ปัญหา → ทดสอบ → ออกแบบวิธีแก้","วิเคราะห์ปัญหา → ออกแบบวิธีแก้ → ลงมือทำ/เขียนโปรแกรม → ทดสอบและปรับปรุง","ทดสอบ → เขียนโปรแกรม → วิเคราะห์ปัญหา → ปรับปรุง","ออกแบบหน้าจอ → ส่งงาน → วิเคราะห์ปัญหา → ทดสอบ"],a:1,e:"ควรเริ่มจากวิเคราะห์ปัญหา ออกแบบวิธีแก้ ลงมือพัฒนา แล้วทดสอบและปรับปรุง"},
{q:"โครงสร้างแบบเงื่อนไข (Condition) เหมาะสำหรับสถานการณ์ใด",c:["ทำคำสั่งเดิมทุกครั้งโดยไม่มีการตรวจสอบ","เลือกทำงานแตกต่างกันตามเงื่อนไขที่กำหนด","เก็บข้อมูลจำนวนมากในตัวแปรเดียว","แสดงผลเฉพาะข้อความบนหน้าจอ"],a:1,e:"โครงสร้างเงื่อนไขใช้เมื่อโปรแกรมต้องเลือกทำงานตามผลของเงื่อนไข"},
{q:"ข้อใดเป็นข้อมูลชนิดจำนวนเต็ม (Integer)",c:["25","3.14","Hello","True"],a:0,e:"25 เป็นจำนวนเต็ม ไม่มีส่วนทศนิยม"},
{q:"ข้อใดเป็นประโยชน์ของการเขียนรหัสลำลอง (Pseudocode)",c:["ช่วยวางแผนขั้นตอนการแก้ปัญหาก่อนเขียนโปรแกรมจริง","ทำให้คอมพิวเตอร์ทำงานเร็วขึ้นโดยอัตโนมัติ","ใช้แทนฐานข้อมูลทุกชนิด","ใช้สำหรับตกแต่งหน้าจอโปรแกรม"],a:0,e:"Pseudocode ช่วยอธิบายลำดับการทำงานก่อนนำไปเขียนเป็นโปรแกรมจริง"},
{q:"ข้อใดอธิบาย Input ได้ถูกต้องที่สุด",c:["ข้อมูลที่นำเข้าสู่ระบบเพื่อประมวลผล","ผลลัพธ์ที่ได้หลังจากประมวลผล","ขั้นตอนการแก้ข้อผิดพลาด","การลบข้อมูลออกจากระบบ"],a:0,e:"Input คือข้อมูลที่ป้อนเข้าสู่ระบบหรือโปรแกรมเพื่อใช้ในการประมวลผล"},
{q:"ข้อใดอธิบาย Output ได้ถูกต้องที่สุด",c:["ข้อมูลที่ผู้ใช้ป้อนเข้าโปรแกรม","ผลลัพธ์ที่ระบบแสดงหลังการประมวลผล","คำสั่งที่ใช้เริ่มโปรแกรม","ชุดข้อมูลที่ใช้ฝึก AI เท่านั้น"],a:1,e:"Output คือผลลัพธ์ที่ได้จากการประมวลผล"},
{q:"หากต้องการหาคะแนนเฉลี่ยของนักเรียน 3 คน ขั้นตอนใดถูกต้อง",c:["นำคะแนนทั้ง 3 คนบวกกันแล้วหารด้วย 3","นำคะแนนสูงสุดลบคะแนนต่ำสุด","นำคะแนนทั้ง 3 คนคูณกัน","เลือกใช้เฉพาะคะแนนของคนแรก"],a:0,e:"ค่าเฉลี่ยเลขคณิตหาได้จากผลรวมของข้อมูลหารด้วยจำนวนข้อมูล"},
{q:"ข้อใดเป็นตัวอย่างของการใช้เงื่อนไขในชีวิตประจำวัน",c:["ถ้าฝนตกให้พกร่ม มิฉะนั้นไม่ต้องพก","เดินไปข้างหน้า 10 ก้าวทุกครั้ง","เขียนชื่อซ้ำ 20 ครั้ง","บวกเลข 1 ถึง 100"],a:0,e:"ประโยค ถ้า...มิฉะนั้น... เป็นตัวอย่างของการตัดสินใจตามเงื่อนไข"},
{q:"ข้อใดเป็นเหตุผลสำคัญที่ควรทดสอบโปรแกรมหลังเขียนเสร็จ",c:["เพื่อค้นหาข้อผิดพลาดและตรวจสอบว่าผลลัพธ์ตรงตามความต้องการ","เพื่อทำให้ไฟล์มีขนาดใหญ่ขึ้น","เพื่อเปลี่ยนชื่อโปรแกรมอัตโนมัติ","เพื่อให้ไม่ต้องออกแบบอัลกอริทึม"],a:0,e:"การทดสอบช่วยตรวจสอบความถูกต้องของโปรแกรมและค้นหาข้อผิดพลาด"},
{q:"การนำวิธีแก้ปัญหาที่เคยใช้ได้ผลกับปัญหาหนึ่งไปประยุกต์กับปัญหาที่มีลักษณะคล้ายกัน เกี่ยวข้องกับแนวคิดใดมากที่สุด",c:["การหารูปแบบ","การเข้ารหัสข้อมูล","การจัดเก็บไฟล์","การสร้างเครือข่าย"],a:0,e:"การหารูปแบบช่วยให้มองเห็นความคล้ายกันของปัญหาและนำแนวทางเดิมมาประยุกต์ใช้"},
{q:"ข้อใดเป็นคุณลักษณะของอัลกอริทึมที่ดี",c:["มีขั้นตอนชัดเจน เป็นลำดับ และสามารถทำตามได้","มีขั้นตอนคลุมเครือเพื่อให้ตีความได้หลายแบบ","ต้องเขียนด้วยภาษา Python เท่านั้น","ต้องมีจำนวนขั้นตอนมากที่สุด"],a:0,e:"อัลกอริทึมที่ดีควรมีขั้นตอนชัดเจน เป็นลำดับ และนำไปปฏิบัติได้จริง"}
];
const Q=document.getElementById('questions'),bar=document.getElementById('progressBar'),at=document.getElementById('answeredText'),form=document.getElementById('quizForm'),res=document.getElementById('result'),scoreEl=document.getElementById('scoreText'),note=document.getElementById('resultNote'),review=document.getElementById('answerReview'),status=document.getElementById('sendStatus'),btn=document.getElementById('submitBtn');
function render(){Q.innerHTML=quiz.map((x,i)=>`<div class="question"><h3>${i+1}. ${x.q}</h3>${x.c.map((v,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}"><span>${String.fromCharCode(3585+j)}. ${v}</span></label>`).join('')}</div>`).join('');document.querySelectorAll('input[type=radio]').forEach(x=>x.addEventListener('change',progress))}
function progress(){let n=0;quiz.forEach((_,i)=>{if(document.querySelector(`input[name=q${i}]:checked`))n++});at.textContent=`ตอบแล้ว ${n}/${quiz.length}`;bar.style.width=`${n/quiz.length*100}%`}
function studentOK(){if(!fullname.value.trim()||!classroom.value.trim()||!number.value.trim()){alert('กรุณากรอกชื่อ-สกุล ชั้น และเลขที่ให้ครบ');return false}return true}
function calc(){let s=0,a=[];quiz.forEach((x,i)=>{let z=document.querySelector(`input[name=q${i}]:checked`),v=z?Number(z.value):null;a.push(v);if(v===x.a)s++});return{s,a}}
function show(s,a){scoreEl.textContent=`${s}/${quiz.length}`;let p=Math.round(s/quiz.length*100);note.textContent=p>=80?`ยอดเยี่ยมมาก ได้ ${p}%`:p>=60?`ทำได้ดี ได้ ${p}% ลองทบทวนข้อที่ผิดอีกเล็กน้อย`:`ได้ ${p}% ควรทบทวนเนื้อหาแล้วลองใหม่อีกครั้ง`;review.innerHTML=quiz.map((x,i)=>{let ok=a[i]===x.a,yt=a[i]===null?'ไม่ได้ตอบ':x.c[a[i]];return `<div class="review-item ${ok?'correct':'wrong'}"><strong>ข้อ ${i+1}: ${ok?'✅ ถูกต้อง':'❌ ยังไม่ถูก'}</strong><br><small>คำตอบของคุณ: ${yt}<br>เฉลย: ${x.c[x.a]}<br>เหตุผล: ${x.e}</small></div>`}).join('');res.style.display='block';res.scrollIntoView({behavior:'smooth'})}
async function send(payload){try{status.className='status warn';status.textContent='กำลังบันทึกผลลง Google Sheets...';await fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});status.className='status ok';status.textContent='✅ บันทึกผลลง Google Sheets เรียบร้อยแล้ว'}catch(e){status.className='status warn';status.textContent='ตรวจคะแนนได้แล้ว แต่ส่งข้อมูลไป Google Sheets ไม่สำเร็จ'}}
form.addEventListener('submit',async e=>{e.preventDefault();if(!studentOK())return;let{s,a}=calc();show(s,a);let payload={timestamp:new Date().toISOString(),fullname:fullname.value.trim(),classroom:classroom.value.trim(),number:number.value.trim(),school:school.value.trim(),score:s,total:quiz.length,answers:a.map((v,i)=>({question:i+1,selectedIndex:v,selectedText:v===null?'':quiz[i].c[v],correctIndex:quiz[i].a,isCorrect:v===quiz[i].a}))};btn.disabled=true;await send(payload);btn.disabled=false});render();
</script>
</body>
</html>
